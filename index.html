<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ポーカー道場">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>ポーカー道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --bg:#0F1A17;--surface:#17261F;--line:#263B32;
  --card:#F3EEE2;--ink:#14110D;--red:#C2412D;--brass:#C9A24A;
  --text:#E8E4D8;--muted:#8FA39A;--good:#5FB37A;--bad:#D9604A;
  --callc:#3E7A55;
  --f-display:"Bricolage Grotesque","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding:0 16px 40px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px}
.logo{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.sub{display:block;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.hdr-right{display:flex;align-items:center;gap:10px}
.score{text-align:right;line-height:1.2}
.score .lbl{display:block;font-size:10px;color:var(--muted)}
.score b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.score .stk{display:block;font:500 11px var(--f-mono);color:var(--brass)}
.ghost{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-weight:500;font-size:13px;cursor:pointer}
.tabwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:6px 0 10px;margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.tabs button{min-height:44px;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:13px;border-radius:7px;cursor:pointer;padding:0 2px}
.tabs button[aria-selected="true"]{background:var(--brass);color:var(--ink);font-weight:700}
h2.sec{font:700 13px var(--f-body);color:var(--muted);letter-spacing:.06em;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:#3a5649}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.primary:hover{background:#d6b25c}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.btn.picked{border-color:var(--text)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
/* cards */
.cd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:56px;border-radius:5px;background:var(--card);color:var(--ink);font-family:var(--f-mono);font-weight:600;line-height:1;flex:none;box-shadow:inset 0 0 0 1px rgba(20,17,13,.18)}
.cd .rk{font-size:18px;letter-spacing:-.04em}
.cd .st{font-size:16px;margin-top:3px}
.cd.red{color:var(--red)}
.cd.lg{width:60px;height:84px;border-radius:7px}
.cd.lg .rk{font-size:28px}.cd.lg .st{font-size:24px;margin-top:4px}
.cd.md{width:34px;height:48px}
.cd.md .rk{font-size:16px}.cd.md .st{font-size:14px;margin-top:2px}
.cd.sm{width:26px;height:36px;border-radius:4px}
.cd.sm .rk{font-size:12px}.cd.sm .st{font-size:11px;margin-top:1px}
.cd.xs{width:20px;height:28px;border-radius:3px}
.cd.xs .rk{font-size:10px}.cd.xs .st{font-size:9px;margin-top:0}
.cd.back{background:repeating-linear-gradient(45deg,rgba(201,162,74,.9) 0 1.5px,transparent 1.5px 5px),repeating-linear-gradient(-45deg,rgba(201,162,74,.9) 0 1.5px,transparent 1.5px 5px),#1B2A22;box-shadow:inset 0 0 0 2px var(--card)}
.cd.mini{width:14px;height:20px;border-radius:2px;box-shadow:inset 0 0 0 1.5px var(--card)}
.cd.empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cd.dim{opacity:.32}
.cd.hi{box-shadow:0 0 0 2px var(--brass)}
.cards{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.lbl-s{font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
/* question block */
.q{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.qtag{display:inline-block;font:600 11px var(--f-mono);color:var(--brass);border:1px solid rgba(201,162,74,.45);border-radius:4px;padding:1px 6px;margin-bottom:8px}
.qtext{font-weight:500;margin:10px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.opt{min-height:52px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;font-size:16px;cursor:pointer;padding:6px 8px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.opt.num{font-family:var(--f-mono)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.right::before{content:"✓ "}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.wrong::before{content:"✗ "}
.opt .cat{display:block;width:100%;font:500 11px var(--f-body);color:var(--muted)}
.verdict{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;margin:16px 0 4px}
.verdict .mk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:17px;font-family:var(--f-body)}
.verdict.ok{color:var(--good)}.verdict.ok .mk{border:2px solid var(--good)}
.verdict.ng{color:var(--bad)}.verdict.ng .mk{border:2px solid var(--bad);border-radius:4px}
.verdict .vx{font:500 13px var(--f-body);color:var(--muted);margin-left:auto}
.expl{font-size:14px;line-height:1.75}
.expl p{margin:6px 0}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;overflow-x:auto}
.next{margin-top:14px;width:100%}
/* preflop */
.handline{display:flex;align-items:center;gap:14px;margin:6px 0 2px}
.hk{font:700 26px var(--f-display);letter-spacing:.01em}
.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:500 8px/1 var(--f-mono);color:var(--muted);background:var(--bg);letter-spacing:-.03em}
@media (min-width:420px){.grid div{font-size:10px}}
.grid .g-r{background:var(--brass);color:var(--ink)}
.grid .g-c{background:var(--callc);color:#EAF3EC}
.grid .g-rc{background:linear-gradient(135deg,var(--brass) 50%,var(--callc) 50%);color:var(--ink)}
.grid .g-rf{background:linear-gradient(135deg,var(--brass) 50%,#2A3C33 50%);color:var(--ink)}
.grid .g-cf{background:linear-gradient(135deg,var(--callc) 50%,#2A3C33 50%);color:#EAF3EC}
.grid .g-me{outline:2px solid #fff;outline-offset:-2px;font-weight:700;position:relative;z-index:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* round table (shared by preflop drill + play) */
.rt{position:relative;width:100%;-webkit-user-select:none;user-select:none;--g-early:#93AFC0;--g-mid:#8EC0AE;--g-late:#D6B66E;--g-blind:#D39482}
.rt-pre{height:clamp(216px,66vw,256px);margin:4px -4px 2px;width:auto}
.rt-play{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto;height:min(100%,calc(min(100vw,520px) * 1.3))}
.rt-felt{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,#1D3D30 0%,#152C22 60%,#10211A 100%);box-shadow:0 0 0 6px #0D1B15,0 0 0 7px rgba(201,162,74,.38),inset 0 0 0 1px rgba(232,228,216,.05)}
.rt-ring{position:absolute;left:0;top:0;border:1px dashed rgba(201,162,74,.28);border-radius:50%;display:none;pointer-events:none}
.rt.ord .rt-ring{display:block}
.rt-ring i{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;left:calc(50% + var(--c) * 50%);top:calc(50% + var(--s) * 50%);transform:rotate(var(--r))}
.rt-ring i::before{content:"";position:absolute;left:1px;top:2.5px;width:5px;height:5px;border-top:1.5px solid rgba(201,162,74,.8);border-right:1.5px solid rgba(201,162,74,.8);transform:rotate(45deg)}
.rt-dealer{position:absolute;left:0;top:0;z-index:1;display:flex;flex-direction:column;align-items:center;padding:2px 7px;background:#0D1B15;border:1px solid rgba(201,162,74,.55);border-radius:7px;font:500 9px/1.15 var(--f-body);color:var(--brass);letter-spacing:.05em;white-space:nowrap}
.rt-dealer svg{display:block;width:16px;height:11px}
.rt-dealer .c1{fill:#BDB6A4}.rt-dealer .c2{fill:var(--card)}
.rt-center{position:absolute;left:0;top:0;z-index:1;display:flex;flex-direction:column;align-items:center}
.rt-pot{font:600 12px var(--f-mono);white-space:nowrap;margin-bottom:5px}
.rt-pot span{font:400 10px var(--f-body);color:var(--muted);margin-right:4px}
.rt-pot small{font:400 10px var(--f-mono);color:var(--muted);margin-left:6px}
.rt-board{display:flex;gap:4px}
.rt.short .rt-board,.rt.nb .rt-board{gap:3px}
.rt.short .rt-board .cd,.rt.nb .rt-board .cd{width:27px;height:38px}
.rt.short .rt-board .cd .rk,.rt.nb .rt-board .cd .rk{font-size:13px}.rt.short .rt-board .cd .st,.rt.nb .rt-board .cd .st{font-size:12px;margin-top:1px}
.rt-seat{position:absolute;left:0;top:0;z-index:2;background:rgba(14,25,21,.95);border:1px solid var(--line);border-radius:8px;text-align:center;line-height:1.2}
.rt-ord{display:none;position:absolute;top:-7px;left:-7px;width:17px;height:17px;border-radius:50%;background:var(--bg);border:1px solid rgba(201,162,74,.8);color:var(--brass);font:600 9.5px/15px var(--f-mono);text-align:center}
.rt.ord .rt-ord{display:block}
.rt-pos{font-family:var(--f-mono);font-weight:700}
.rt-grp{display:inline-block;font:500 9px/1.35 var(--f-body);padding:0 4px;border-radius:3px;border:1px solid;white-space:nowrap}
.g-early{color:var(--g-early);border-color:rgba(147,175,192,.38)}
.g-mid{color:var(--g-mid);border-color:rgba(142,192,174,.38)}
.g-late{color:var(--g-late);border-color:rgba(214,182,110,.4)}
.g-blind{color:var(--g-blind);border-color:rgba(211,148,130,.4)}
.rt-mini{min-width:56px;padding:2px 6px 3px}
.rt-mini .rt-pos{display:block;font-size:14px;line-height:1.25}
.rt-note{display:block;font:600 10px/1.2 var(--f-mono);color:var(--muted);margin-top:1px}
.rt-seat.fold{opacity:.4}
.rt-seat.me{border-color:var(--brass);background:#262A1C;box-shadow:0 0 0 1px var(--brass)}
.rt-seat.me .rt-pos,.rt-seat.me .rt-note{color:var(--brass)}
.rt-seat.op{border-color:rgba(217,96,74,.75)}
.rt-seat.op .rt-note{color:#F0B4A6}
.rt-cpu{width:80px;padding:2px 4px 3px}
.rt-h{display:flex;align-items:center;justify-content:center;gap:4px;line-height:1.3}
.rt-cpu .rt-pos,.rt-hero .rt-pos{font-size:12px}
.rt-m{display:flex;align-items:center;justify-content:center;gap:5px;height:24px}
.rt .sk{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.rt-sc{display:flex;gap:2px}
.rt-sc .cd.mini{width:13px;height:19px}
.rt-sc .cd.xs{width:17px;height:23px}.rt-sc .cd.xs .rk{font-size:9.5px}.rt-sc .cd.xs .st{font-size:8.5px}
.rt .la{font-size:10px;line-height:1.3;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .la .nm{color:#B9C4BC;margin-right:3px}
.rt .la.w{color:var(--good);font-weight:700}
.rt-seat.turn{border-color:var(--brass);box-shadow:0 0 0 2px rgba(201,162,74,.5);animation:rtPulse 1.4s ease-in-out infinite}
@keyframes rtPulse{50%{box-shadow:0 0 0 4px rgba(201,162,74,.16)}}
.rt-seat.win{border-color:var(--good);box-shadow:0 0 0 1px var(--good)}
.rt-hero{width:132px;padding:4px 6px 3px}
.rt-hc{display:flex;gap:4px;justify-content:center}
.rt-hero .rt-hc .cd{width:46px;height:64px;border-radius:6px}
.rt-hero .rt-hc .cd .rk{font-size:22px}.rt-hero .rt-hc .cd .st{font-size:19px;margin-top:3px}
.rt.short .rt-hero .rt-hc .cd{width:38px;height:53px;border-radius:5px}
.rt.short .rt-hero .rt-hc .cd .rk{font-size:18px}.rt.short .rt-hero .rt-hc .cd .st{font-size:15px;margin-top:2px}
.rt-hl{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:3px}
.rt-hero .sk{color:var(--brass)}
.rt-mk{position:absolute;left:0;top:0;z-index:3;pointer-events:none}
.rt-chip{display:flex;align-items:center;gap:3px;font:600 11px/1 var(--f-mono);padding:2px 6px 2px 3px;border-radius:999px;background:#2A2412;border:1px solid rgba(201,162,74,.6);color:var(--brass);white-space:nowrap}
.rt-chip::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 2px #2A2412,inset 0 0 0 3px var(--brass)}
.rt-chip.op{border-color:rgba(217,96,74,.8);color:#F0B4A6;background:#2B1A15}
.rt-chip.op::before{background:#D9604A;box-shadow:inset 0 0 0 2px #2B1A15,inset 0 0 0 3px #D9604A}
.rt-d{width:19px;height:19px;border-radius:50%;background:var(--card);color:var(--ink);font:700 10px/19px var(--f-mono);text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 0 0 1.5px #CFC6B0}
.rt-corner{position:absolute;top:0;z-index:4;min-height:34px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:rgba(14,25,21,.92);color:var(--muted);font:500 12px var(--f-body);cursor:pointer}
.rt-corner::after{content:"";position:absolute;inset:-6px}
.rt-corner.l{left:0}.rt-corner.r{right:0}
.rt-corner[aria-pressed="true"]{color:var(--brass);border-color:rgba(201,162,74,.6)}
.rt-ban{max-width:min(230px,64vw);padding:5px 12px 6px;margin-bottom:6px;border-radius:10px;background:rgba(13,27,21,.96);border:1px solid var(--brass);text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.rt-ban b{display:block;font:700 13px/1.35 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-ban span b{display:inline;font:inherit;font-weight:700}
.rt-ban span{display:block;font:500 11px/1.35 var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-cap{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.rt-cap b{color:var(--brass);font-weight:700}
/* play: fixed-height app shell (no document scroll) */
html.playmode{height:100%;height:100dvh;overflow:hidden}
html.playmode body{height:100%;overflow:hidden}
.playmode .app{height:100%;min-height:0;max-width:520px;display:flex;flex-direction:column;padding-bottom:6px}
.playmode .top{height:44px;padding:0;flex:none}
.playmode .logo{font-size:18px}
.playmode .sub,.playmode .score .lbl{display:none}
.playmode .score{display:flex;align-items:baseline;gap:8px}
.playmode .score b{font-size:15px}
.playmode .ghost{min-height:36px}
.playmode .tabwrap{position:static;flex:none;padding:0 0 6px;margin:0}
.playmode main{flex:1;min-height:0;display:flex;flex-direction:column}
.playmode #panel-play{flex:1;min-height:0;display:flex;flex-direction:column}
#playStage{position:relative;flex:1;min-height:0;margin-bottom:6px}
#playCtl{position:relative;flex:none;display:flex;flex-direction:column;justify-content:flex-end;border-top:1px solid var(--line);padding-top:6px}
.sizes{display:flex;gap:6px;margin-bottom:6px}
.chipbtn{min-height:38px;flex:1 1 0;min-width:0;padding:0 2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:600 13px var(--f-mono);cursor:pointer}
.chipbtn.on{border-color:var(--brass);color:var(--brass)}
.slider{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.slider label{font-size:12px;color:var(--muted)}
.slider input{flex:1;accent-color:var(--brass);min-height:28px;margin:0}
.slider output{font:600 14px var(--f-mono);min-width:64px;text-align:right}
.acts3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.acts3 .btn{min-height:50px;padding:0 6px;font-size:15px}
.btn.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;padding:3px 4px}
.btn.ab b{font-size:14.5px;white-space:nowrap}
.btn.ab small{font:500 10.5px/1.2 var(--f-body);opacity:.78;white-space:nowrap}
.btn.ab.open{box-shadow:0 0 0 2px var(--text) inset}
.hint{font:500 11px/1.4 var(--f-mono);color:var(--muted);margin:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--text);font-weight:600}
.wait{color:var(--muted);text-align:center;min-height:50px;display:flex;align-items:center;justify-content:center;margin:0}
@media (max-height:600px){.chipbtn{min-height:34px}.slider input{min-height:24px}.acts3 .btn{min-height:46px}.narr{height:36px}}
.flagn{color:var(--bad);font-family:var(--f-mono);font-size:12px;margin-left:4px}
.handres{font-size:14px;margin-bottom:10px}
.handres .net{font:700 18px var(--f-mono)}
.pos-c{color:var(--good)}.neg-c{color:var(--bad)}
table.rv{width:100%;border-collapse:collapse;font-size:12px}
table.rv th,table.rv td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.rv th{color:var(--muted);font-weight:500}
table.rv td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.flag-ok{color:var(--good)}.flag-ng{color:var(--bad);font-weight:700}
.seg{display:flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
.seg button{min-height:38px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:500;font-size:13px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--brass);color:var(--ink);font-weight:700}
ol.logl{margin:4px 0 0;padding-left:20px;font-size:12px;line-height:1.7;color:var(--muted)}
ol.logl li.h{color:var(--text)}
ol.logl li.st{color:var(--brass);list-style:none;margin-left:-20px;margin-top:4px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet[hidden]{display:none}
.sheet-bd{position:absolute;inset:0;background:rgba(5,10,8,.7)}
.sheet-panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h2{font:700 20px var(--f-display);margin:0}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:9px 4px;border-bottom:1px solid var(--line);text-align:right}
table.st th[scope=row],table.st thead th:first-child{text-align:left;font-weight:500}
table.st thead th{font-size:11px;color:var(--muted);font-weight:500}

.bigs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}

.bigs b{display:block;font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.bigs span{font-size:11px;color:var(--muted)}
.confirmbox{border:1px solid var(--bad);border-radius:10px;padding:12px;margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* play: clarity aids */
.streets{display:flex;gap:3px;list-style:none;margin:0 0 5px;padding:0;flex:none}
.streets li{flex:1 1 auto;min-width:0;text-align:center;font:500 10.5px/22px var(--f-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:clip;padding:0 2px}
.streets li.done{color:#B9C4BC;background:transparent}
.streets li.now{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.streets li.now.end{background:#3a4a40;border-color:#3a4a40;color:var(--text)}
.narr{height:38px;margin:0 0 5px;font-size:12.5px;line-height:19px;overflow:hidden}

.narr span:first-child{color:#C9D2CC}
.narr.ask .n2{color:var(--brass);font-weight:700}
.narr.over span:first-child{color:var(--text);font-weight:700}

.coach{display:flex;flex-direction:column;justify-content:center;width:100%;min-height:44px;text-align:left;padding:3px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;margin:0 0 6px;font:400 11px/1.55 var(--f-body)}

.coach.info b{font-family:var(--f-mono)}
.rc-good{color:var(--good)}.rc-bad{color:var(--bad)}.rc-mid{color:var(--brass)}
.rt-seat.myturn{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass),0 0 18px 3px rgba(201,162,74,.5);animation:none}
.rt-seat.just{border-color:#9FB3A7;box-shadow:0 0 0 1px rgba(159,179,167,.6)}
.rt .la .yt{color:var(--brass);font-weight:700}
.rt-corner.bl{top:auto;bottom:0;left:0}
.raisepop{position:absolute;left:0;right:0;bottom:100%;margin-bottom:6px;z-index:20;background:var(--surface);border:1px solid var(--brass);border-radius:12px;padding:10px;box-shadow:0 -8px 24px rgba(0,0,0,.5)}
.rp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;font-size:13px}

dl.cdl dd{margin:0}
/* training */
.tr-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 6px}
.tgl{position:relative;min-height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:500 12px var(--f-body);cursor:pointer}
.tgl::after{content:"";position:absolute;inset:-7px -2px}
.tgl[aria-pressed="true"]{color:var(--brass);border-color:rgba(201,162,74,.6)}
.tgl:disabled{opacity:.4;cursor:default}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.stg button{min-height:48px;padding:4px 2px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;text-align:center}

.stg .ss{font:500 10px var(--f-mono);color:var(--muted);margin-top:2px}
.stg button[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass);background:#22301F}
.stg button.clr .ss{color:var(--good)}
.stg button.lock{opacity:.55}
.stg button:disabled{opacity:.35;cursor:default}
.stg-prog{font:400 11px/1.55 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);margin:6px 0 8px;min-height:34px}
.stg{margin-top:2px}
.stg-prog b{color:var(--text);font-family:var(--f-mono)}
.stg-prog.unlock{color:var(--good);font-weight:700;font-size:12.5px;white-space:normal}
.tr-bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tr-bar .seg{flex:1}
.tr-bar .seg button{flex:1;min-height:44px;padding:0 4px;white-space:nowrap;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--ink);font-weight:700}
.tr-bar .ghost{min-height:46px;padding:0 10px;white-space:nowrap}
.tglg[aria-pressed="true"]{color:var(--brass);border-color:rgba(201,162,74,.7)}
.tq{position:relative;padding:12px 14px}
.tq-head{display:flex;justify-content:space-between;align-items:center}
.tq-time{font-size:13px;color:var(--muted)}
.tq-cards{display:flex;gap:18px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
.tq-pot{margin:10px 0 0;font-size:15px}

.tq-big{display:flex;gap:10px;margin-top:12px}
.tq-big>div{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;display:flex;flex-direction:column}
.tq-big .lbl-s{margin:0}
.tq-big b{font:700 34px/1.15 var(--f-mono)}
.tq-big b.sm{font:700 22px/1.4 var(--f-body)}
.tq-big b small{font-size:15px;margin-left:2px;color:var(--muted)}
.tq-big span:last-child:not(.lbl-s){font-size:12px;color:var(--muted)}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts4 .opt{position:relative;min-height:52px;font-size:20px;flex-direction:column;gap:0}
.tq .qtext{font-size:14.5px;margin-top:8px}
.opts4.two .opt{min-height:64px;font-size:19px}
.opts4 .opt .cat{font-size:11px;margin-top:2px;width:auto}
.opts4 .opt.right::before,.opts4 .opt.wrong::before{position:absolute;right:9px;top:5px;font-size:13px}
.opt .key{position:absolute;left:7px;top:5px;font:500 10px var(--f-mono);color:var(--muted);display:none}
@media (hover:hover) and (pointer:fine){.opt .key{display:block}}
.rate.good{color:var(--good)}.rate.mid{color:var(--brass)}.rate.bad{color:var(--bad)}
.flash{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:rgba(15,26,23,.9);text-align:center;padding:16px;animation:flashIn .12s ease-out}
.flash b{font:700 64px/1 var(--f-body)}
.flash.ok b{color:var(--good)}.flash.ng b{color:var(--bad)}
.flash span{font:700 17px/1.4 var(--f-body)}
@keyframes flashIn{from{opacity:0;transform:scale(.97)}}
.atk{display:flex;align-items:center;gap:10px;margin-bottom:8px;min-height:46px}
.atk-t{font:700 24px var(--f-mono);min-width:64px}
.atk-bar{flex:1;height:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.atk-bar i{display:block;height:100%;background:var(--brass);transform-origin:left center}
.atk-s{font-size:13px;white-space:nowrap}
.atk-s b{font-size:18px}
.atk-res{text-align:center}
.atk-big b{display:block;font:700 64px/1.1 var(--f-display)}
.atk-big span{color:var(--muted)}
.nb{color:var(--good);font:700 18px var(--f-body);margin:8px 0}
ol.chain{list-style:none;margin:6px 0;padding:0;font-size:14px}
ol.chain li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
ol.chain li span{flex:none;width:76px;color:var(--brass);font-size:12px;padding-top:2px}
.ch-h{font:700 14px var(--f-body);margin:14px 0 4px}
table.st.ch td,table.st.ch th{padding:6px 4px;font-size:13px}
table.st.ch thead th{line-height:1.3}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

<script>
(function(){
'use strict';
/*ENGINE-START*/
var RANKS='23456789TJQKA';
var SUIT_CH=['♠','♥','♦','♣'];
var SUIT_NAME=['スペード','ハート','ダイヤ','クラブ'];
var CAT_NAMES=['ハイカード','ワンペア','ツーペア','スリーカード','ストレート','フラッシュ','フルハウス','フォーカード','ストレートフラッシュ'];
function rankLabel(r){return r===8?'10':RANKS[r];}
function rOf(c){return c>>2;}
function sOf(c){return c&3;}
function rnd(n){
  try{ if(typeof crypto!=='undefined'&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;} }catch(e){}
  return Math.floor(Math.random()*n);
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function freshDeck(){var d=[];for(var i=0;i<52;i++)d.push(i);return shuffle(d);}
function deckWithout(dead){var s={};for(var k=0;k<dead.length;k++)s[dead[k]]=1;var d=[];for(var i=0;i<52;i++)if(!s[i])d.push(i);return d;}
/* fast random draw (Math.random) for generators/MC */
function drawCards(n,dead){var d=deckWithout(dead||[]);for(var k=0;k<n;k++){var j=k+Math.floor(Math.random()*(d.length-k));var t=d[k];d[k]=d[j];d[j]=t;}return d.slice(0,n);}

/* ---------- 7-card evaluator ---------- */
var CNT=new Int32Array(13),SM=new Int32Array(4),SC=new Int32Array(4);
var CAT_BASE=1048576; /* 16^5 */
function straightHigh(mask){
  var m=(mask<<1)|((mask>>12)&1); /* bit0 = ace-low */
  for(var h=13;h>=4;h--){if(((m>>(h-4))&31)===31)return h-1;}
  return -1;
}
function topBits(mask,n){var out=[];for(var r=12;r>=0&&out.length<n;r--)if(mask&(1<<r))out.push(r);return out;}
function pack(cat,k){var v=cat;for(var i=0;i<5;i++)v=v*16+(k[i]>0?k[i]:0);return v;}
function catOf(v){return Math.floor(v/CAT_BASE);}
function evaluate(cards){
  CNT.fill(0);SM.fill(0);SC.fill(0);var rm=0,i,r,s;
  for(i=0;i<cards.length;i++){var c=cards[i];r=c>>2;s=c&3;CNT[r]++;SC[s]++;SM[s]|=1<<r;rm|=1<<r;}
  var fs=-1;for(s=0;s<4;s++)if(SC[s]>=5)fs=s;
  if(fs>=0){var sf=straightHigh(SM[fs]);if(sf>=0)return pack(8,[sf]);}
  var quad=-1,trips=[],pairs=[];
  for(r=12;r>=0;r--){var n=CNT[r];if(n===4)quad=r;else if(n===3)trips.push(r);else if(n===2)pairs.push(r);}
  if(quad>=0)return pack(7,[quad].concat(topBits(rm&~(1<<quad),1)));
  if(trips.length&&(trips.length>1||pairs.length)){
    var t=trips[0],p=pairs.length?pairs[0]:-1;if(trips.length>1&&trips[1]>p)p=trips[1];
    return pack(6,[t,p]);
  }
  if(fs>=0)return pack(5,topBits(SM[fs],5));
  var st=straightHigh(rm);if(st>=0)return pack(4,[st]);
  if(trips.length){var t2=trips[0];return pack(3,[t2].concat(topBits(rm&~(1<<t2),2)));}
  if(pairs.length>=2){var a=pairs[0],b=pairs[1];return pack(2,[a,b].concat(topBits(rm&~(1<<a)&~(1<<b),1)));}
  if(pairs.length===1){var a1=pairs[0];return pack(1,[a1].concat(topBits(rm&~(1<<a1),3)));}
  return pack(0,topBits(rm,5));
}
function best5(cards){
  var n=cards.length,best=-1,bc=null;
  if(n<=5)return {val:evaluate(cards),cards:cards.slice()};
  for(var a=0;a<n;a++)for(var b=a+1;b<n;b++)for(var c=b+1;c<n;c++)for(var d=c+1;d<n;d++)for(var e=d+1;e<n;e++){
    var h=[cards[a],cards[b],cards[c],cards[d],cards[e]];var v=evaluate(h);if(v>best){best=v;bc=h;}
  }
  return {val:best,cards:bc};
}
function describe(v){
  var cat=catOf(v),k0=Math.floor(v/65536)%16,k1=Math.floor(v/4096)%16,L=rankLabel;
  switch(cat){
    case 0:return 'ハイカード（'+L(k0)+'ハイ）';
    case 1:return 'ワンペア（'+L(k0)+'）';
    case 2:return 'ツーペア（'+L(k0)+'と'+L(k1)+'）';
    case 3:return 'スリーカード（'+L(k0)+'）';
    case 4:return 'ストレート（'+L(k0)+'ハイ）';
    case 5:return 'フラッシュ（'+L(k0)+'ハイ）';
    case 6:return 'フルハウス（'+L(k0)+'の3枚＋'+L(k1)+'の2枚）';
    case 7:return 'フォーカード（'+L(k0)+'）';
    default:return k0===12?'ストレートフラッシュ（ロイヤル）':'ストレートフラッシュ（'+L(k0)+'ハイ）';
  }
}
/* Monte Carlo equity. oppKnown: array of known 2-card hands (optional); remaining opponents random. */
function equity(hero,board,nOpp,iters,oppKnown){
  oppKnown=oppKnown||[];
  var dead=hero.concat(board),i,k;for(i=0;i<oppKnown.length;i++)dead=dead.concat(oppKnown[i]);
  var deck=deckWithout(dead),n=deck.length,nRand=Math.max(0,nOpp-oppKnown.length),needB=5-board.length,need=needB+2*nRand;
  var score=0,b=board.slice(),hc=hero.slice(),oc=[0,0];
  for(var it=0;it<iters;it++){
    for(k=0;k<need;k++){var j=k+Math.floor(Math.random()*(n-k));var t=deck[k];deck[k]=deck[j];deck[j]=t;}
    b.length=board.length;for(k=0;k<needB;k++)b.push(deck[k]);
    var hv=evaluate(hc.concat(b)),mx=-1,cm=0;
    for(i=0;i<oppKnown.length;i++){var v=evaluate(oppKnown[i].concat(b));if(v>mx){mx=v;cm=1;}else if(v===mx)cm++;}
    for(i=0;i<nRand;i++){oc[0]=deck[needB+2*i];oc[1]=deck[needB+2*i+1];var v2=evaluate(oc.concat(b));if(v2>mx){mx=v2;cm=1;}else if(v2===mx)cm++;}
    if(hv>mx)score+=1;else if(hv===mx)score+=1/(cm+1);
  }
  return score/iters;
}
function equityAsync(hero,board,nOpp,iters,oppKnown){
  return new Promise(function(res){
    var done=0,acc=0,chunk=250;
    function step(){var m=Math.min(chunk,iters-done);acc+=equity(hero,board,nOpp,m,oppKnown)*m;done+=m;
      if(done>=iters)res(acc/iters);else setTimeout(step,0);}
    setTimeout(step,0);
  });
}

/* ---------- ranges ---------- */
function normKey(a,b,suited){if(a===b)return RANKS[a]+RANKS[a];var hi=Math.max(a,b),lo=Math.min(a,b);return RANKS[hi]+RANKS[lo]+(suited?'s':'o');}
function handKeyOf(c1,c2){return normKey(rOf(c1),rOf(c2),sOf(c1)===sOf(c2));}
function ri(ch){return RANKS.indexOf(ch);}
function expand(tok){
  var m,out=[],r,a,b;
  if((m=tok.match(/^([2-9TJQKA])\1\+$/))){for(r=ri(m[1]);r<=12;r++)out.push(RANKS[r]+RANKS[r]);return out;}
  if((m=tok.match(/^([2-9TJQKA])\1-([2-9TJQKA])\2$/))){a=ri(m[1]);b=ri(m[2]);if(a>b){r=a;a=b;b=r;}for(r=a;r<=b;r++)out.push(RANKS[r]+RANKS[r]);return out;}

  var mistakes=[pStr(b.f/(1+b.f))];if(b.f<1)mistakes.push(pStr(b.f));
  var table=BETS.map(function(x){return pStr(reqOf(x.f));});
  var o=[ans],m=gShuf(mistakes.filter(function(x){return x!==ans;}));if(m.length)o.push(m[0]);
  var near=table.filter(function(x){return o.indexOf(x)<0;}).sort(function(x,y){return Math.abs(parseFloat(x)-req*100)-Math.abs(parseFloat(y)-req*100)+(Math.random()-0.5)*6;});
  for(var i=0;i<near.length&&o.length<4;i++)if(o.indexOf(near[i])<0)o.push(near[i]);
  return {stage:3,b:b,form:form,P:nb.P,B:nb.B,req:req,ans:ans,opts:gShuf(o).map(function(x){return {v:x,t:x};})};
}
function genStage4(){
  for(var t=0;t<100;t++){
    var d=genDrawSpot(S4_W);if(!d)continue;
    var flop=d.board.length===3,eq=flop?ruleFlop(d.n):d.n*2;
    var bs=gShuf(BETS.slice()),b=null;

function markCands(S,mw,mh,cx,cy){
  var sx=S.x+S.w/2,sy=S.y+S.h/2,dx=cx-sx,dy=cy-sy,L=Math.sqrt(dx*dx+dy*dy)||1;dx/=L;dy/=L;
  var gx=dx>=0?1:-1,gy=dy>=0?1:-1,g=4,adx=Math.abs(dx),ady=Math.abs(dy);

  return [
    [sx+dx*t,sy+dy*t],                                  /* straight toward the centre */
    [sx+gx*(S.w/2-mw/2),sy+gy*(S.h/2+g+mh/2)],          /* inner corner, vertical */
    [sx+gx*(S.w/2+g+mw/2),sy],                          /* inner side */
    [sx+gx*(S.w/2+g+mw/2),sy+gy*(S.h/2-mh/2)],
    [sx+gx*(S.w/2+g+mw/2),sy-gy*(S.h/2-mh/2)],          /* inner side, away from centre line */
    [sx-gx*(S.w/2-mw/2),sy+gy*(S.h/2+g+mh/2)],          /* other corner, vertical */
    [sx+gx*(S.w/2-mw/2),sy-gy*(S.h/2+g+mh/2)],          /* outer corner */
    [sx+dx*(t+16),sy+dy*(t+16)]

function layoutRT(rt){

  var cx=W/2,cy=H/2,rx=Math.max(20,W/2-mw/2-3),ry=Math.max(20,H/2-mh/2-3),obs=[];
  S.forEach(function(s,k){
    var x,y;
    if(k===0){x=cx;y=H-s.h/2-2;}
    else{var a=SEAT_ANG[k]*Math.PI/180;x=cx+rx*Math.cos(a);y=cy+ry*Math.sin(a);}

  var ring=rt.querySelector('.rt-ring'),qx=rx*0.6,qy=ry*0.58;
  ring.style.left=(cx-qx)+'px';ring.style.top=(cy-qy)+'px';ring.style.width=2*qx+'px';ring.style.height=2*qy+'px';
  var dl=rt.querySelector('.rt-dealer'),dw=dl.offsetWidth,dh=dl.offsetHeight,dy=Math.max(0,Math.round(cy-fy-dh/2));
  dl.style.left=Math.round(cx-dw/2)+'px';dl.style.top=dy+'px';obs.push({x:cx-dw/2,y:dy,w:dw,h:dh});
  var ce=rt.querySelector('.rt-center');
  var lim=Math.floor(2*(rx*0.98-mw/2)-10),ban=ce.querySelector('.rt-ban');if(ban)ban.style.maxWidth=Math.max(120,lim)+'px';
  rt.classList.remove('nb');if(ce.offsetWidth>lim)rt.classList.add('nb'); /* board/banner must fit between the side seats */
  var cw=ce.offsetWidth,ch=ce.offsetHeight,cty=Math.round(cy-ch/2),bestY=cty,bestO=Infinity;
  /* nudge the centre block vertically until it clears every seat */
  [0,-4,4,-8,8,-12,12,-16,16,-20,20,-26,26,-32,32].some(function(d){var r={x:cx-cw/2-3,y:cty+d-3,w:cw+6,h:ch+6},o=0;S.forEach(function(s){o+=ovl(r,s.r);});if(o<bestO){bestO=o;bestY=cty+d;}return o===0;});
  cty=bestY;
  ce.style.left=Math.round(cx-cw/2)+'px';ce.style.top=cty+'px';obs.push({x:cx-cw/2,y:cty,w:cw,h:ch});
  rt.querySelectorAll('.rt-corner').forEach(function(b){obs.push(boxOf(b));});

function sampleHand(map){
  var keys=[],w=[],tot=0,i,j,di,dj;
  for(i=0;i<13;i++)for(j=0;j<13;j++){
    var k=gridKey(i,j),code=map[k]||'f',wt;
    if(code!=='f')wt=code.length>1?4:2.2;
    else{wt=0.3;for(di=-1;di<=1;di++)for(dj=-1;dj<=1;dj++){var a=i+di,b=j+dj;if(a>=0&&a<13&&b>=0&&b<13&&(map[gridKey(a,b)]||'f')!=='f')wt=2.4;}}
    keys.push(k);w.push(wt);tot+=wt;
  }
  var x=Math.random()*tot;for(i=0;i<keys.length;i++){x-=w[i];if(x<=0)return keys[i];}
  return keys[keys.length-1];
}

$('#panel-pre').addEventListener('click',function(e){

/* =========================================================
   MODE 1: 確率トレ (speed curriculum)
   ========================================================= */
var STAGES=[null,
  {name:'アウツ即答',target:5,goal:'ドローの形から、アウツ（完成するカードの枚数）を即答'},
  {name:'アウツ→勝率',target:4,goal:'アウツ数から「2と4の法則」で完成する確率を即答'},
  {name:'必要勝率',target:4,goal:'ベットの大きさから、コールに必要な勝率を即答'},
  {name:'コール判断',target:8,goal:'アウツ→勝率→必要勝率 をつないでコールか判断'}];
var HIST_N=20,ATK_MS=60000,PENALTY=3000;
var T={stage:1,fmt:'prac',q:null,tick:0,atk:null,flash:null,msg:''};
function stStatus(s){
  var h=stats.tr.h[s]||[],n=h.length,ok=0,ms=0;h.forEach(function(x){ok+=x[0];ms+=x[1];});
  var acc=n?ok/n:0,avg=n?ms/n/1000:0,tg=STAGES[s].target;
  return {n:n,acc:acc,avg:avg,cleared:!!stats.tr.clr[s],passNow:n>=HIST_N&&acc>=0.8&&avg<tg};
}
function stUnlocked(s){return s===1||!!stats.tr.clr[s-1];}
function stSelectable(s){return stats.tr.free||stUnlocked(s);}
function speedRate(secs,target){return secs<=target?['速い','good']:secs<=target*1.6?['ふつう','mid']:['遅い','bad'];}
function trRecord(ok,ms){
  var s=T.stage,h=stats.tr.h[s];h.push([ok?1:0,Math.min(Math.round(ms),30000)]);while(h.length>HIST_N)h.shift();
  stats.tr.n[s]++;if(ok)stats.tr.c[s]++;
  var st=stStatus(s);
  if(!stats.tr.clr[s]&&st.passNow){stats.tr.clr[s]=true;T.msg=s<4?'ステージ'+s+' クリア！ ステージ'+(s+1)+'「'+STAGES[s+1].name+'」が解放されました':'全ステージ クリア！ 60秒アタックで自己ベストを狙おう';}
  record('train',ok);
}
function newTrainQ(){
  var q=null;for(var i=0;i<5&&!q;i++)q=GEN[T.stage]();
  q.answered=false;q.choice=null;q.t0=performance.now();q.secs=0;T.q=q;
}
function trStageBtns(){
  var h='<div class="stg" role="group" aria-label="ステージ選択">';
  for(var s=1;s<=4;s++){
    var st=stStatus(s),sel=stSelectable(s),on=T.stage===s,sub;
    if(st.cleared)sub='クリア';else if(!stUnlocked(s))sub='未解放';else sub=st.n+'/'+HIST_N+'問';
    h+='<button type="button" class="'+(st.cleared?'clr':'')+(!stUnlocked(s)?' lock':'')+'" data-stage="'+s+'" aria-pressed="'+(on?'true':'false')+'"'+(sel&&!T.atk?'':' disabled')+
      ' aria-label="ステージ'+s+' '+STAGES[s].name+'（'+sub+'）"><span class="sn">'+STAGES[s].name+'</span><span class="ss"><b>'+s+'</b> · '+sub+'</span></button>';
  }
  return h+'</div>';
}
function trProgLine(){
  var s=T.stage,st=stStatus(s),tg=STAGES[s].target;
  if(T.msg)return '<p class="stg-prog unlock" role="status">'+T.msg+'</p>';
  var cur=st.n?'直近'+st.n+'問 <b>'+Math.round(st.acc*100)+'%</b>・<b>'+st.avg.toFixed(1)+'秒</b>':'記録なし';
  return '<p class="stg-prog">'+STAGES[s].goal+'<br>'+cur+'（'+(st.cleared?'クリア済み・':'')+'条件 20問で80%以上・平均'+tg+'秒未満）</p>';
}
function trQHTML(q){
  var h='',s=q.stage;

    h+='<div class="tq-cards"><div><div class="lbl-s">ボード（'+st+'）</div><div class="cards">'+cardsHTML(q.board,'md')+'</div></div>'+
       '<div><div class="lbl-s">あなた</div><div class="cards">'+cardsHTML(q.hero,'lg')+'</div></div></div>';
    if(s===1)h+='<p class="qtext">'+ASK_TXT[q.ask]+'</p>';

      '<p class="qtext">'+(q.flop?'リバーまでに完成する確率はおよそ？':'リバーで完成する確率はおよそ？')+'</p>';

    h+='<div class="tq-big"><div><span class="lbl-s">'+(q.form==='num'?'ポット':'ベットの大きさ')+'</span><b'+(q.form==='num'?'':' class="sm"')+'>'+(q.form==='num'?fmtN(q.P)+'<small>bb</small>':(q.b.f===1?'ポット':q.b.f===2?'ポットの2倍':'ポットの'+q.b.t))+'</b></div>'+
      (q.form==='num'?'<div><span class="lbl-s">相手のベット</span><b>'+fmtN(q.B)+'<small>bb</small></b></div>':'')+'</div>'+
      '<p class="qtext">コールするのに必要な勝率は？</p>';
  }
  return h;
}
function trOptsHTML(q){
  var two=q.opts.length===2;
  return '<div class="opts4'+(two?' two':'')+'">'+q.opts.map(function(o,k){var cls='opt'+(q.stage===4?'':' num');
    if(q.answered){if(o.v===q.ans)cls+=' right';else if(o.v===q.choice)cls+=' wrong';}
    return '<button type="button" class="'+cls+'" id="trOpt'+k+'" data-v="'+o.v+'"'+(q.answered||T.flash?' disabled':'')+'><span class="key" aria-hidden="true">'+(k+1)+'</span>'+o.t+(q.stage===4?'<span class="cat">'+(o.v==='call'?'払って続ける':'降りる')+'</span>':'')+'</button>';}).join('')+'</div>';
}
function briefAns(q){
  if(q.stage===1)return q.n+'枚（'+q.label+'）';
  if(q.stage===2)return q.ans+'%';
  if(q.stage===3)return q.ans;
  return (q.ans==='call'?'コール':'フォールド')+'（'+q.eq+'% '+(q.ans==='call'?'＞':'＜')+' '+pStr(q.req)+'）';
}
function trExplain(q){
  var h='<div class="expl">',n;
  if(q.stage===1){
    n=q.n;
    h+='<p><b>'+q.label+'</b> → アウツ <b class="mono">'+n+'</b> 枚</p><div class="cards" style="margin:4px 0">'+cardsHTML(q.outs.slice().sort(function(a,b){return b-a;}),'xs')+'</div>';
    var tip={fd:'同じマーク13枚 − 見えている4枚 = 9枚',oesd:'両端の2ランク × 4枚 = 8枚',gut:'真ん中の1ランク × 4枚 = 4枚',fdo:'フラッシュ9 + 両面8 − 重複2 = 15枚',fdg:'フラッシュ9 + ガット4 − 重複1 = 12枚',over:'2ランク × 残り3枚 = 6枚',set:q.board.length===3?'ボード2ランク×3枚 + 4枚目1枚 = 7枚':'ボード3ランク×3枚 + 4枚目1枚 = 10枚',tp:'手札2ランク × 残り2枚 = 4枚',pp:'同じ数字の残り2枚'};
    h+='<p class="muted small">覚え方：'+tip[q.type]+'。迷ったら「早見表」へ。</p>';
  }else if(q.stage===2){
    n=q.n;
    h+='<div class="formula">'+(q.flop?'2枚見られる → アウツ × 4'+(n>8?' −（アウツ − 8）':'')+'<br>= '+n+' × 4'+(n>8?' − '+(n-8):'')+' = '+q.ans+'%':'1枚だけ → アウツ × 2<br>= '+n+' × 2 = '+q.ans+'%')+'<br>正確な確率: '+pStr(q.exact)+'</div>';
    if(q.flop&&n>8)h+='<p class="muted small">アウツが9枚以上のときは ×4 だと大きく出すぎるので「−（アウツ−8）」で補正します。</p>';
    else if(q.flop)h+='<p class="muted small">×4 はリバーまで2枚とも見られる（相手がオールイン等）ときだけ。ターンでまたベットされるなら ×2 で考えます。</p>';
  }else if(q.stage===3){
    h+='<div class="formula">必要勝率 = ベット ÷（ポット ＋ ベット × 2）<br>'+(q.form==='num'?'= '+fmtN(q.B)+' ÷（'+fmtN(q.P)+' ＋ '+fmtN(q.B)+' × 2）= '+q.ans:'ポットの'+q.b.t+'ベット → '+q.ans)+'</div>'+
      '<p class="muted small">暗記：1/4→16.7% ・1/3→20% ・1/2→25% ・2/3→28.6% ・3/4→30% ・ポット→33.3% ・2倍→40%'+(q.form==='num'?'（'+fmtN(q.B)+'÷'+fmtN(q.P)+' = ポットの'+q.b.t+'）':'')+'</p>';
  }else{
    n=q.n;var eqHow=q.flop?n+' × 4'+(n>8?' − '+(n-8):'')+' = '+q.eq+'%':n+' × 2 = '+q.eq+'%';
    h+='<ol class="chain"><li><span>①アウツ</span>'+q.label+' → <b>'+n+'枚</b></li><li><span>②勝率</span>'+eqHow+'</li><li><span>③必要勝率</span>'+fmtN(q.B)+' ÷（'+fmtN(q.P)+' ＋ '+fmtN(q.B)+'×2）= <b>'+pStr(q.req)+'</b></li></ol>'+
      '<p><b>'+q.eq+'% '+(q.ans==='call'?'＞':'＜')+' '+pStr(q.req)+'</b> → <b class="'+(q.ans==='call'?'pos-c':'neg-c')+'">'+(q.ans==='call'?'コール':'フォールド')+'</b>が得</p>'+
      '<p class="muted small">勝率が必要勝率を上回ればコール。実戦では、完成後に追加で勝てる額（インプライドオッズ）も少し考えます。</p>';
  }
  return h+'</div>';
}
function renderTrain(){
  var q=T.q,s=T.stage,A=T.atk,h='';
  h+=trStageBtns();
  h+=trProgLine();
  if(A&&!A.done){
    h+='<div class="atk" role="group" aria-label="60秒アタック"><span class="atk-t mono" id="atkTime">'+(Math.max(0,A.left)/1000).toFixed(1)+'</span><span class="atk-bar" aria-hidden="true"><i id="atkBar" style="transform:scaleX('+Math.max(0,A.left/ATK_MS)+')"></i></span><span class="atk-s">正解 <b class="mono" id="atkScore">'+A.score+'</b></span><button type="button" class="ghost" id="atkStop">やめる</button></div>';
  }else{
    h+='<div class="tr-bar"><div class="seg" role="group" aria-label="形式"><button type="button" id="fmtPrac" aria-pressed="'+(T.fmt==='prac'?'true':'false')+'">練習</button><button type="button" id="fmtAtk" aria-pressed="'+(T.fmt==='atk'?'true':'false')+'">60秒アタック</button></div><button type="button" class="ghost" id="cheatBtn" aria-haspopup="dialog">早見表</button><button type="button" class="ghost tglg" id="trFree" aria-pressed="'+(stats.tr.free?'true':'false')+'" title="未解放のステージも選べるようにする">自由に選ぶ</button></div>';
  }
  if(A&&A.done){
    var best=stats.tr.best[s];
    h+='<div class="q atk-res" role="status"><span class="qtag">60秒アタック 結果</span><div class="atk-big"><b class="mono">'+A.score+'</b><span>問正解</span></div>'+
      (A.newBest?'<p class="nb">自己ベスト更新！</p>':'<p class="muted small">自己ベスト：'+best+'問</p>')+
      '<p class="muted small">回答 '+A.n+'問 · ミス '+A.wrong+'（1ミス −3秒）'+(A.n?' · 平均 '+(A.ms/A.n/1000).toFixed(1)+'秒':'')+'</p>'+
      '<div class="row" style="margin-top:12px"><button type="button" class="btn" id="atkBack">練習に戻る</button><button type="button" class="btn primary" id="atkAgain">もう一度</button></div></div>';
    $('#panel-train').innerHTML=h;return;
  }
  if(T.fmt==='atk'&&!A){
    var b=stats.tr.best[s];
    h+='<div class="q"><span class="qtag">60秒アタック · ステージ'+s+'</span><p class="qtext">60秒で何問正解できるか。ミスすると −3秒。<br>答えはタップ、PCなら数字キー 1〜4。</p><p class="muted small">自己ベスト：'+(b?b+'問':'まだなし')+' · 1問の目標 '+STAGES[s].target+'秒</p><button type="button" class="btn primary next" id="atkStart">スタート</button></div>';
    $('#panel-train').innerHTML=h;return;
  }
  var rate=q.answered?speedRate(q.secs,STAGES[s].target):null;
  h+='<div class="q tq" id="trQ"><div class="tq-head"><span class="qtag" style="margin:0">ステージ'+s+' · '+STAGES[s].name+'</span><span class="tq-time mono" id="trTime" aria-live="off">'+(q.answered?q.secs.toFixed(1):((performance.now()-q.t0)/1000).toFixed(1))+'秒</span></div>';
  h+=trQHTML(q)+trOptsHTML(q);
  if(T.flash)h+='<div class="flash '+(T.flash.ok?'ok':'ng')+'" role="status"><b>'+(T.flash.ok?'✓':'✗')+'</b>'+(T.flash.ok?'':'<span>正解：'+briefAns(q)+'</span>')+'</div>';
  if(q.answered&&!A){
    h+=verdict(q.choice===q.ans,'<span class="rate '+rate[1]+'">'+q.secs.toFixed(1)+'秒 · '+rate[0]+'</span>')+trExplain(q)+
      '<button type="button" id="trNext" class="btn primary next">次の問題 <span class="muted small">(Enter)</span></button>';
  }
  h+='</div>';
  $('#panel-train').innerHTML=h;
}
function trTickStart(){
  clearInterval(T.tick);
  T.tick=setInterval(function(){
    if(curMode!=='train'){return;}
    var A=T.atk,now=performance.now();
    if(A&&!A.done){
      if(!T.flash){A.left-=now-A.last;}A.last=now;
      var e=document.getElementById('atkTime');if(e)e.textContent=(Math.max(0,A.left)/1000).toFixed(1);
      var bar=document.getElementById('atkBar');if(bar)bar.style.transform='scaleX('+Math.max(0,A.left/ATK_MS)+')';
      if(A.left<=0&&!T.flash){endAttack();return;}
    }
    var q=T.q;if(q&&!q.answered&&!T.flash){var te=document.getElementById('trTime');if(te)te.textContent=((now-q.t0)/1000).toFixed(1)+'秒';}
  },100);
}
function trAnswer(v){
  var q=T.q;if(!q||q.answered||T.flash)return;
  var ms=performance.now()-q.t0,ok=v===q.ans;
  q.answered=true;q.choice=v;q.secs=ms/1000;
  trRecord(ok,ms);
  var A=T.atk;
  if(A&&!A.done){
    A.n++;A.ms+=ms;if(ok)A.score++;else{A.wrong++;A.left-=PENALTY;}
    T.flash={ok:ok};q.answered=false; /* keep options neutral under the flash */
    renderTrain();
    setTimeout(function(){
      T.flash=null;if(!T.atk||T.atk!==A)return;A.last=performance.now();
      if(A.left<=0){endAttack();return;}
      newTrainQ();renderTrain();focusLater('trOpt0');
    },ok?450:900);
    return;
  }
  renderTrain();
  requestAnimationFrame(function(){var n=document.getElementById('trNext');if(n){n.focus({preventScroll:true});try{n.scrollIntoView({block:'nearest',behavior:REDUCED?'auto':'smooth'});}catch(e){}}});
}
function startAttack(){T.msg='';T.atk={left:ATK_MS,last:performance.now(),score:0,wrong:0,n:0,ms:0,done:false};newTrainQ();renderTrain();trTickStart();focusLater('trOpt0');}
function endAttack(){
  var A=T.atk;if(!A||A.done)return;A.done=true;T.flash=null;
  var s=T.stage;A.newBest=A.score>stats.tr.best[s];if(A.newBest)stats.tr.best[s]=A.score;saveStats();
  renderTrain();focusLater('atkAgain');
}
function abortAttack(){if(T.atk){T.atk=null;T.flash=null;}}
function setStage(s){
  if(s<1||s>4||!stSelectable(s))return;
  abortAttack();T.stage=s;T.msg='';stats.tr.cur=s;saveStats();newTrainQ();renderTrain();
}
function trainInit(){
  var s=stats.tr.cur;if(!(s>=1&&s<=4)||!stSelectable(s)){s=1;for(var k=4;k>=1;k--)if(stUnlocked(k)){s=k;break;}}
  T.stage=s;newTrainQ();renderTrain();trTickStart();
}
$('#panel-train').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.hasAttribute('data-stage')){setStage(+b.getAttribute('data-stage'));return;}
  if(b.hasAttribute('data-v')){trAnswer(b.getAttribute('data-v'));return;}
  switch(b.id){
    case 'trNext':T.msg='';newTrainQ();renderTrain();focusLater('trOpt0');break;
    case 'trFree':stats.tr.free=!stats.tr.free;saveStats();if(!stSelectable(T.stage)){var k=4;while(k>1&&!stUnlocked(k))k--;T.stage=k;newTrainQ();}renderTrain();focusLater('trFree');break;
    case 'fmtPrac':T.fmt='prac';abortAttack();newTrainQ();renderTrain();focusLater('fmtPrac');break;
    case 'fmtAtk':T.fmt='atk';renderTrain();focusLater('atkStart');break;
    case 'atkStart':startAttack();break;
    case 'atkAgain':T.atk=null;startAttack();break;
    case 'atkStop':abortAttack();renderTrain();focusLater('atkStart');break;
    case 'atkBack':T.atk=null;T.fmt='prac';newTrainQ();renderTrain();focusLater('fmtPrac');break;
    case 'cheatBtn':openInfo('早見表',cheatHTML(),'cheatBtn');break;
  }
});
function cheatHTML(){

function buildPots(){

    if(!any)break;

  var eq=equity(p.hole,G.board,nOpp,200)-0.05*Math.min(2,G.streetAgg);

  function S(f){var to=G.currentBet===0?Math.round(x.pot*f):G.currentBet+Math.round((x.pot+x.toCall)*f);if(to<x.minTo)to=x.minTo;if(to>=x.maxTo*0.8)to=x.maxTo;return {type:'raise',to:Math.min(to,x.maxTo)};}
  if(x.toCall<=0){
    if(x.canRaise&&eq>0.66)return S(eq>0.82?0.75:pick([0.5,0.66,0.75]));
    if(x.canRaise&&eq>0.52&&r<st.aggr*0.6)return S(pick([0.33,0.5]));
    if(x.canRaise&&eq<0.35&&G.street<3&&r<st.bluff)return S(0.5);
    return {type:'check'};
  }
  var odds=x.toCall/(x.pot+x.toCall);
  if(x.canRaise&&eq>0.8&&r<0.4+st.aggr*0.4)return S(0.75);
  if(eq>=odds+st.margin)return {type:'call'};
  if(x.canRaise&&G.street<3&&r<st.bluff*0.4)return S(0.66);
  return {type:'fold'};
}
/* ---------- review ---------- */
function runReview(){
  var ds=G.decisions,hand=G.handNo;
  if(!ds.length){G.review={rows:[],pending:false,empty:true};renderReview();return;}
  G.review={rows:[],pending:true};renderReview();
  var idx=0;
  (function next(){
    if(G.handNo!==hand)return;
    if(idx>=ds.length){G.review.pending=false;var fl=G.review.rows.filter(function(r){return r.flag;}).length;stats.play.flags+=fl;saveStats();renderReview();return;}
    var d=ds[idx++];
    equityAsync(d.hole,d.board,Math.max(1,d.nOpp),2000).then(function(eq){
      if(G.handNo!==hand)return;
      var req=d.toCall>0?d.toCall/(d.pot+d.toCall):0,flag='';
      if(d.type==='fold'&&d.toCall<=0)flag='チェックできた';
      else if(d.type==='fold'&&eq>req+0.05)flag='フォールド過多？';
      else if(d.type==='call'&&eq<req-0.10)flag='コールが薄い';
      G.review.rows.push({d:d,eq:eq,req:req,flag:flag});renderReview();next();
    });
  })();
}

function coachKey(){return G.handNo+'-'+G.log.length;}
function coachCompute(){
  var p=G.players[0],o=heroOptions(),pot=potTotal(),toCall=o.toCall,req=toCall>0?toCall/(pot+toCall):0;
  var nOpp=G.players.filter(function(q,k){return k&&!q.folded;}).length;
  var c={key:coachKey(),toCall:toCall,pot:pot,req:req,canCheck:o.canCheck,canRaise:o.canRaise,pre:G.street===0,nOpp:nOpp};
  if(G.street===0){
    var hk=handKeyOf(p.hole[0],p.hole[1]),ch=chen(hk),code,ctx;
    c.hk=hk;c.tier=ch>=12?'プレミアム':ch>=9?'強い':ch>=7?'まずまず':'弱い';
    if(G.raises===0){
      if(p.pos==='BB'){code=ch>=11?'r':'x';ctx='BBはもう1bb払い済み';}
      else{var m=rfiMap(p.pos);code=(m&&m[hk])||'f';ctx=code==='f'?p.pos+'のオープンレンジ外':code==='r'?p.pos+'のオープンレンジ内':p.pos+'のレンジの境目';}
    }else if(G.raises===1&&G.opener&&G.opener!==p.pos){
      var vm=vsMap(p.pos+'_'+G.opener);
      if(vm){code=vm[hk]||'f';ctx=p.pos+' vs '+G.opener+'のオープン';}
      else{code=ch>=12?'r':ch>=9?'c':'f';ctx='手の強さで判断';}
    }else{code=(ch>=14||hk==='AKs'||hk==='AKo')?'c':ch>=12?'cf':'f';ctx='3ベット以降は強い手だけ';}
    var R={r:[G.raises?'3ベット有利':'レイズ有利','good'],rc:['3ベットかコール','good'],c:['コール有利','good'],x:['チェックでOK','good'],
      rf:[G.raises?'3ベットかフォールド（混合）':'レイズかフォールド（混合）','mid'],cf:['コールかフォールド（混合）','mid'],f:[o.canCheck?'チェック有利（無料）':'フォールド有利','bad']}[code];
    c.ctx=ctx;c.rec=R[0];c.recCls=R[1];c.code=code;
    c.l1=hk+'（'+c.tier+'）· '+ctx;
    return c;
  }
  var v=evaluate(p.hole.concat(G.board)),cat=catOf(v);
  c.made=handName(v);
  if(G.board.length===5&&evaluate(G.board)>=v)c.made+='（ボードの役だけ）';
  var outs=G.street<3&&cat<4?sfOuts(p.hole,G.board):[];
  c.draw=outs.length?{label:drawLabel(p.hole,G.board,outs)||'ドロー',n:outs.length}:null;
  var allIn=toCall>0&&(toCall>=p.stack||G.players.some(function(q){return !q.hero&&!q.folded&&q.allIn;}));
  if(c.draw&&cat<=1){
    var n=c.draw.n,two=G.street===1&&allIn;
    c.eq=two?ruleFlop(n):n*2;c.eqSrc='outs';
    c.eqHow=two?n+' × 4'+(n>8?' − '+(n-8):'')+' = '+c.eq+'%（リバーまで2枚：オールインなので）':n+' × 2 = '+c.eq+'%（次の1枚で完成する確率）';
    if(cat===1)c.eqHow+='。ペアのまま勝つ分は含まないので実際は少し高め';
  }else{
    c.eq=Math.round(equity(p.hole,G.board,Math.max(1,nOpp),700)*100);c.eqSrc='mc';
    c.eqHow='約'+c.eq+'%（相手'+nOpp+'人がランダムな手と仮定したシミュレーション。レイズしてきた相手には実際もっと低め）';
  }
  var reqP=Math.round(req*100),rec;
  if(toCall>0){
    var diff=c.eq-req*100;
    if(c.eq>=70&&o.canRaise)rec=['レイズも有力（強い手）','good'];
    else if(diff>=5)rec=['コール有利','good'];else if(diff<=-5)rec=['フォールド有利','bad'];else rec=['判断が分かれる','mid'];
  }else{
    rec=c.eq>=65&&o.canRaise?['ベット有利（強い手で稼ぐ）','good']:['チェック有利（無料で次へ）','good'];
  }
  c.rec=rec[0];c.recCls=rec[1];c.reqP=reqP;
  c.l1=c.made+(c.draw?' ＋ '+c.draw.label+' '+c.draw.n+'アウツ':G.street<3?' · ドローなし':'');
  return c;
}

    h+='<div class="raisepop" role="dialog" aria-label="'+(isBet?'ベット':'レイズ')+'額を選ぶ">'+
      '<div class="rp-h"><b>'+(isBet?'いくら賭ける？':'いくらにレイズする？')+'</b><span class="muted small">ポット '+fmt(pot)+'bb · 最小 '+fmt(o.minTo)+'bb</span></div>'+
      '<div class="sizes" role="group" aria-label="サイズ">'+ps.map(function(x,k){return '<button type="button" class="chipbtn'+(x[1]===G.raiseTo?' on':'')+'" id="sz'+k+'" data-to="'+x[1]+'">'+x[0]+'</button>';}).join('')+'</div>'+
      '<div class="slider"><label for="raiseSlider">サイズ</label><input type="range" id="raiseSlider" min="'+o.minTo+'" max="'+o.maxTo+'" step="1" value="'+G.raiseTo+'"><output id="raiseOut" for="raiseSlider">'+fmt(G.raiseTo)+'bb</output></div>'+
      '<div class="row"><button type="button" class="btn" id="raiseCancel">やめる</button><button type="button" class="btn primary" id="raiseGo">'+raiseLabel(G.raiseTo,o)+'</button></div></div>';
  }
  el.innerHTML=h;
}
$('#panel-play').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(/^act/.test(b.id))G.kbd=e.detail===0?b.id:null;
  if(b.id==='actFold')heroAct('fold');
  else if(b.id==='actCall')heroAct('call');
  else if(b.id==='actRaise'){G.raiseOpen=!G.raiseOpen;renderControls();focusLater(G.raiseOpen?'raiseGo':'actRaise');}
  else if(b.id==='raiseGo')heroAct('raise');
  else if(b.id==='raiseCancel'){G.raiseOpen=false;renderControls();focusLater('actRaise');}
  else if(b.hasAttribute('data-to')){G.raiseTo=+b.getAttribute('data-to');renderControls();focusLater(b.id);}
  else if(b.id==='coachBtn'){
    if(stats.pref.coach&&stats.pref.quiz&&G.toAct===0&&!G.over&&G.coachRev!==coachKey()){G.coachRev=coachKey();renderControls();focusLater('coachBtn');}
    else openInfo('コーチ',coachDetailHTML(),'coachBtn','coach');
  }
  else if(b.id==='playSpd'){var ks=['slow','mid','fast'];stats.pref.speed=ks[(ks.indexOf(stats.pref.speed)+1)%3];saveStats();renderPlay();focusLater('playSpd');}
  else if(b.id==='nextHand'){G.review=null;newHand();focusLater(G.toAct===0?'actCall':'nextHand');}
  else if(b.id==='rebuy'){G.players[0].stack=START;G.needRebuy=false;G.sdText=null;G.resultHTML='スタックを100bbにリセットしました。';G.banner={main:'スタックを100bbにリセット',sub:'「次のハンド」で再開'};renderPlay();focusLater('nextHand');}
  else if(b.id==='playOrd')toggleOrder(b);
  else if(b.id==='playLogBtn')openPS('log','playLogBtn');
  else if(b.id==='revBtn')openPS('rev','revBtn');
});
$('#panel-play').addEventListener('input',function(e){
  if(e.target.id!=='raiseSlider')return;
  G.raiseTo=+e.target.value;var o=heroOptions();
  $('#raiseOut').textContent=fmt(G.raiseTo)+'bb';var rb=$('#raiseGo');if(rb)rb.textContent=raiseLabel(G.raiseTo,o);
  document.querySelectorAll('.chipbtn').forEach(function(c){c.classList.toggle('on',+c.getAttribute('data-to')===G.raiseTo);});
});
/* play bottom sheet: review + hand log */
var PS={pane:'rev',opener:null};
function showPSPane(){var r=PS.pane==='rev';$('#psRev').setAttribute('aria-selected',r?'true':'false');$('#psLog').setAttribute('aria-selected',r?'false':'true');$('#psRev').tabIndex=r?0:-1;$('#psLog').tabIndex=r?-1:0;$('#psRevBody').hidden=!r;$('#psLogBody').hidden=r;}
function openPS(pane,opener){PS.pane=pane;PS.opener=opener;renderReview();showPSPane();$('#psheet').hidden=false;focusLater('psClose');}
function closePS(){$('#psheet').hidden=true;var o=PS.opener&&document.getElementById(PS.opener);if(o)o.focus({preventScroll:true});}
$('#psheet').addEventListener('click',function(e){
  if(e.target.closest('[data-pclose]')||e.target.id==='psClose'){closePS();return;}
  var b=e.target.closest('[role=tab]');if(b){PS.pane=b.id==='psLog'?'log':'rev';showPSPane();b.focus();}
});
$('#psheet').addEventListener('keydown',function(e){
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.getAttribute('role')==='tab'){PS.pane=PS.pane==='rev'?'log':'rev';showPSPane();$(PS.pane==='rev'?'#psRev':'#psLog').focus();e.preventDefault();}
});
if(typeof ResizeObserver!=='undefined'){try{new ResizeObserver(function(){layoutRT($('#playStage .rt'));}).observe($('#playStage'));}catch(e){}}

/* =========================================================
   STATS SHEET
   ========================================================= */
var confirmReset=false;
function renderStats(){
  var trRows='';
  for(var k=1;k<=4;k++){var st=stStatus(k);trRows+='<tr><th scope="row">'+k+'. '+STAGES[k].name+(st.cleared?' <span class="pos-c small">済</span>':'')+'</th><td>'+stats.tr.n[k]+'</td><td>'+(st.n?Math.round(st.acc*100)+'%':'—')+'</td><td>'+(st.n?st.avg.toFixed(1)+'s':'—')+'</td><td>'+(stats.tr.best[k]||'—')+'</td></tr>';}
  var ps=stats.pre,net=stats.play.net;
  $('#statsBody').innerHTML='<div class="bigs"><div><b>'+stats.streak+'</b><span>現在の連続正解</span></div><div><b>'+stats.best+'</b><span>最高連続正解</span></div></div>'+
    '<h2 class="sec">確率トレ</h2><table class="st"><thead><tr><th>ステージ</th><th>回答</th><th>正解率<br>直近20</th><th>平均<br>直近20</th><th>60秒<br>ベスト</th></tr></thead><tbody>'+trRows+'</tbody></table>'+
    '<h2 class="sec">プリフロップ</h2><table class="st"><tbody><tr><th scope="row">回答</th><td>'+ps.n+'</td></tr><tr><th scope="row">正解率</th><td>'+(ps.n?Math.round(ps.c/ps.n*100)+'%':'—')+'</td></tr></tbody></table>'+
    '<h2 class="sec">実戦</h2><table class="st"><tbody><tr><th scope="row">プレイしたハンド</th><td>'+stats.play.hands+'</td></tr><tr><th scope="row">累計収支</th><td class="'+(net>0?'pos-c':net<0?'neg-c':'')+'">'+(net>0?'+':'')+fmt(net)+'bb</td></tr><tr><th scope="row">振り返りの要確認</th><td>'+stats.play.flags+'</td></tr></tbody></table>'+
    '<p class="muted small">このセッション: '+sess.c+' / '+sess.n+' 正解。成績はこのブラウザにのみ保存されます（保存できない環境ではページを閉じると消えます）。</p>';
  $('#resetArea').innerHTML=confirmReset?
    '<div class="confirmbox" role="alertdialog" aria-labelledby="rstMsg"><p id="rstMsg" style="margin:0 0 10px">全モードの成績を消去します。よろしいですか？</p><div class="row"><button type="button" id="rstYes" class="btn danger">リセットする</button><button type="button" id="rstNo" class="btn">キャンセル</button></div></div>':
    '<button type="button" id="rstAsk" class="btn" style="width:100%;margin-top:14px">成績をリセット</button>';
}
function openSheet(){confirmReset=false;renderStats();$('#sheet').hidden=false;focusLater('sheetClose');}
function closeSheet(){$('#sheet').hidden=true;$('#statsBtn').focus();}
$('#statsBtn').addEventListener('click',openSheet);
$('#sheet').addEventListener('click',function(e){
  if(e.target.closest('[data-close]')||e.target.id==='sheetClose'){closeSheet();return;}
  var id=e.target.closest('button')&&e.target.closest('button').id;
  if(id==='rstAsk'){confirmReset=true;renderStats();focusLater('rstNo');}
  else if(id==='rstNo'){confirmReset=false;renderStats();focusLater('rstAsk');}
  else if(id==='rstYes'){var keepPref=stats.pref;stats=defStats();stats.pref=keepPref;abortAttack();T.msg='';if(!stSelectable(T.stage))T.stage=1;newTrainQ();renderTrain();sess={n:0,c:0};saveStats();confirmReset=false;renderHeader();renderStats();focusLater('rstAsk');}
});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!$('#isheet').hidden)closeInfo();else if(!$('#psheet').hidden)closePS();else if(!$('#sheet').hidden)closeSheet();else if(curMode==='play'&&G.raiseOpen){G.raiseOpen=false;renderControls();focusLater('actRaise');}});

/* ---------- boot ---------- */
renderHeader();
trainInit();
})();
</script>

if('serviceWorker' in navigator){
  try{
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }catch(e){}
}
</script>
